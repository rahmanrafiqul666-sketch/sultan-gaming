<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>SULTAN CYBER RACING 2077 - FINAL</title><style>*{margin:0;padding:0;box-sizing:border-box;user-select:none;font-family:'Segoe UI',sans-serif}body,html{width:100%;height:100%;overflow:hidden;background:#030308;color:#fff}#game-container{position:relative;width:100vw;height:100vh;display:flex;justify-content:center;align-items:center}canvas{display:block;width:100%;height:100%;background:#000}.hud{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none;z-index:10}.hud-card{background:rgba(10,15,30,.78);border:1px solid #00f0ff;box-shadow:0 0 10px rgba(0,240,255,.4);padding:8px 16px;border-radius:8px;text-align:center;backdrop-filter:blur(5px)}.hud-title{font-size:10px;color:#ff007f;text-transform:uppercase;letter-spacing:2px}.hud-value{font-size:20px;font-weight:bold;color:#00f0ff;text-shadow:0 0 8px #00f0ff}.overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(5,5,15,.88);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:20;backdrop-filter:blur(8px);padding:20px;text-align:center}h1{font-size:38px;color:#00f0ff;text-transform:uppercase;letter-spacing:4px;text-shadow:0 0 15px #00f0ff,0 0 30px #ff007f;margin-bottom:10px}p{color:#aaa;margin-bottom:18px;font-size:14px;max-width:90%}.btn{background:linear-gradient(45deg,#ff007f,#00f0ff);border:none;color:#fff;padding:14px 36px;font-size:16px;font-weight:bold;text-transform:uppercase;letter-spacing:2px;border-radius:30px;cursor:pointer;box-shadow:0 0 15px rgba(0,240,255,.6)}.touch-controls{position:absolute;bottom:18px;left:0;width:100%;display:flex;justify-content:space-between;padding:0 18px;z-index:10}.touch-btn{width:72px;height:72px;background:rgba(0,240,255,.22);border:2px solid #00f0ff;border-radius:50%;display:flex;justify-content:center;align-items:center;font-size:24px;color:#fff}.hidden{display:none!important}#stageBar{display:flex;gap:3px;justify-content:center;margin-top:10px}.dot{width:22px;height:22px;border-radius:50%;background:#222;border:2px solid #555;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:bold}.dot.active{background:#00f0ff;color:#000;box-shadow:0 0 10px #00f0ff;transform:scale(1.1)}.dot.done{background:#00e676;color:#000}</style></head><body><div id="game-container"><canvas id="canvas"></canvas><div class="hud"><div class="hud-card"><div class="hud-title">Score</div><div id="score" class="hud-value">0</div></div><div class="hud-card"><div class="hud-title">Coins</div><div id="coins" class="hud-value" style="color:#ffd700">0</div></div><div class="hud-card"><div class="hud-title">Speed</div><div id="speed" class="hud-value">0 KM/H</div></div></div><div id="start-screen" class="overlay"><h1>👑 SULTAN<br>4D CYBER RACING 2077</h1><p>✅ 100% WORKING - Pure Canvas 2D<br>💨 DRIFT SMOKE - Left/Right pe smoke<br>🌲 FOREST - Side trees + fog<br>🌉 BRIDGE - Cyber bridge cross<br>🌃 NIGHT - Neon lights + sun<br>💰 Coins + Shield + Drift Score</p><div id="stageBar"></div><button id="start-btn" class="btn">🚀 START RACE</button></div><div id="gameover-screen" class="overlay hidden"><h1>SYSTEM CRASH</h1><p>Score: <span id="final-score" style="color:#00f0ff;font-weight:bold">0</span> | Coins: <span id="final-coins" style="color:#ffd700">0</span> | Drift: <span id="final-drift" style="color:#ff007f">0</span></p><button id="restart-btn" class="btn">🔄 RETRY RACE</button></div><div class="touch-controls"><div id="btn-left" class="touch-btn">◄</div><div id="btn-right" class="touch-btn">►</div></div></div><script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}resize();addEventListener('resize',resize);
let gameState='START',score=0,coins=0,driftScore=0,driftTime=0,isDrifting=false,gameSpeed=0,distance=0,shield=0,stage=1,timeLeft=60,stageTimer=null;
const player={x:0,targetX:0};const keys={left:false,right:false};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;});
const btnL=document.getElementById('btn-left'),btnR=document.getElementById('btn-right');
btnL.addEventListener('touchstart',e=>{e.preventDefault();keys.left=true;},{passive:false});btnL.addEventListener('touchend',e=>{e.preventDefault();keys.left=false;},{passive:false});
btnR.addEventListener('touchstart',e=>{e.preventDefault();keys.right=true;},{passive:false});btnR.addEventListener('touchend',e=>{e.preventDefault();keys.right=false;},{passive:false});
let audioCtx=null;function playSound(t){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);if(t==='crash'){o.type='sawtooth';o.frequency.setValueAtTime(120,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(30,audioCtx.currentTime+.5);g.gain.setValueAtTime(.5,audioCtx.currentTime);g.gain.linearRampToValueAtTime(.01,audioCtx.currentTime+.5);o.start();o.stop(audioCtx.currentTime+.5);}else if(t==='coin'){o.type='sine';o.frequency.setValueAtTime(900,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(1400,audioCtx.currentTime+.12);g.gain.setValueAtTime(.3,audioCtx.currentTime);g.gain.linearRampToValueAtTime(.01,audioCtx.currentTime+.18);o.start();o.stop(audioCtx.currentTime+.2);}else if(t==='drift'){o.type='sawtooth';o.frequency.setValueAtTime(100,audioCtx.currentTime);o.frequency.linearRampToValueAtTime(180,audioCtx.currentTime+.2);g.gain.setValueAtTime(.18,audioCtx.currentTime);g.gain.linearRampToValueAtTime(0,audioCtx.currentTime+.22);o.start();o.stop(audioCtx.currentTime+.22);}}
let obstacles=[],coinsArr=[],smokes=[],trees=[],bridgeY=-400,isBridge=false,road=0;
function genTrees(){trees=[];for(let i=0;i<28;i++){trees.push({x:Math.random()*.32,y:Math.random()*800,s:.5+Math.random()*.8,t:Math.random()<.7?'p':'r',d:-1});trees.push({x:.68+Math.random()*.32,y:Math.random()*800,s:.5+Math.random()*.8,t:Math.random()<.7?'p':'r',d:1});}}genTrees();
function spawnObs(){obstacles.push({x:(Math.random()*2-1)*.8,z:1000,color:Math.random()>.5?'#ff007f':'#00f0ff',type:Math.random()<.5?'box':'ship'});}
function spawnCoin(){coinsArr.push({x:(Math.random()*2-1)*.7,z:1000});}
function init(){score=0;coins=0;driftScore=0;driftTime=0;gameSpeed=12;distance=0;player.x=0;player.targetX=0;obstacles=[];coinsArr=[];smokes=[];road=0;bridgeY=-400;timeLeft=60;shield=0;genTrees();dots();startStageTimer();}
function dots(){let h='';for(let i=1;i<=10;i++)h+=`<div class="dot ${i==stage?'active':''} ${i<stage?'done':''}">${i}</div>`;document.getElementById('stageBar').innerHTML=h;}
function startStageTimer(){clearInterval(stageTimer);stageTimer=setInterval(()=>{if(gameState!=='PLAYING')return;timeLeft--;if(timeLeft<=0){stage++;if(stage>10){gameOver(true);return;}timeLeft=60;dots();}},1000);}
let lastTime=0,carSpeedX=0;
function loop(ts){let dt=(ts-lastTime)/1000;if(isNaN(dt))dt=.016;lastTime=ts;update(dt);render();requestAnimationFrame(loop);}
function update(dt){
 if(gameState!=='PLAYING')return;
 if(keys.left)player.targetX-=2.2*dt;if(keys.right)player.targetX+=2.2*dt;player.targetX=Math.max(-.85,Math.min(.85,player.targetX));
 let diff=player.targetX-player.x;carSpeedX+=diff*8*dt;carSpeedX*=0.88;player.x+=carSpeedX;
 let turnForce=Math.abs(carSpeedX);isDrifting=turnForce>0.06&&(keys.left||keys.right)&&gameSpeed>18;
 if(isDrifting){driftTime++;if(driftTime%4==0){smokes.push({x:player.x-0.12,z:30,vx:-0.04+Math.random()*-0.04,l:18,s:0.04});smokes.push({x:player.x+0.12,z:30,vx:0.04+Math.random()*0.04,l:18,s:0.04});if(driftTime%16==0)playSound('drift');}if(driftTime%60==0){driftScore++;score+=50;}}else driftTime=0;
 if(shield>0)shield--;
 gameSpeed+=dt*0.6;distance+=gameSpeed;score=Math.floor(distance/10)+coins*100+driftScore*60;
 document.getElementById('score').innerText=score;document.getElementById('coins').innerText=coins;document.getElementById('speed').innerText=Math.floor(gameSpeed*12)+" KM/H";
 road+=gameSpeed*0.8;bridgeY+=gameSpeed*0.8;if(bridgeY>1200)bridgeY=-600;isBridge=stage>=3&&stage<=7&&bridgeY>100&&bridgeY<700;
 if(Math.random()<0.05&&(obstacles.length==0||obstacles[obstacles.length-1].z<700))spawnObs();
 if(Math.random()<0.04)spawnCoin();
 for(let i=obstacles.length-1;i>=0;i--){let o=obstacles[i];o.z-=gameSpeed*38*dt;if(o.z<60&&o.z>0&&Math.abs(o.x-player.x)<0.25){if(shield>0){obstacles.splice(i,1);score+=50;}else{playSound('crash');gameOver(false);}}if(o.z<=0)obstacles.splice(i,1);}
 for(let i=coinsArr.length-1;i>=0;i--){let c=coinsArr[i];c.z-=gameSpeed*38*dt;if(c.z<60&&c.z>0&&Math.abs(c.x-player.x)<0.22){coinsArr.splice(i,1);coins++;playSound('coin');if(Math.random()<0.15)shield=300;}if(c.z<=0)coinsArr.splice(i,1);}
 smokes.forEach(s=>{s.z-=gameSpeed*30*dt;s.x+=s.vx;s.l--;});smokes=smokes.filter(s=>s.l>0);
 trees.forEach(t=>{t.y+=gameSpeed*2;if(t.y>900){t.y=-100;t.x=t.d==-1?Math.random()*.32:.68+Math.random()*.32;}});
}
function render(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 const cx=canvas.width/2,horizon=canvas.height*0.46;
 let skyGrad=ctx.createLinearGradient(0,0,0,horizon);skyGrad.addColorStop(0,'#03030f');skyGrad.addColorStop(1,'#1a0033');ctx.fillStyle=skyGrad;ctx.fillRect(0,0,canvas.width,horizon);
 let sunGrad=ctx.createRadialGradient(cx,horizon-20,10,cx,horizon-20,90);sunGrad.addColorStop(0,'#ffff00');sunGrad.addColorStop(0.5,'#ff007f');sunGrad.addColorStop(1,'transparent');ctx.fillStyle=sunGrad;ctx.beginPath();ctx.arc(cx,horizon-20,90,0,Math.PI*2);ctx.fill();
 let groundGrad=ctx.createLinearGradient(0,horizon,0,canvas.height);groundGrad.addColorStop(0,'#0a001a');groundGrad.addColorStop(1,'#020005');ctx.fillStyle=groundGrad;ctx.fillRect(0,horizon,canvas.width,canvas.height-horizon);
 const roadTopWidth=40,roadBottomWidth=canvas.width*0.9;
 ctx.fillStyle='#0d001a';ctx.beginPath();ctx.moveTo(cx-roadTopWidth/2,horizon);ctx.lineTo(cx+roadTopWidth/2,horizon);ctx.lineTo(cx+roadBottomWidth/2,canvas.height);ctx.lineTo(cx-roadBottomWidth/2,canvas.height);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#00f0ff';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(cx-roadTopWidth/2,horizon);ctx.lineTo(cx-roadBottomWidth/2,canvas.height);ctx.moveTo(cx+roadTopWidth/2,horizon);ctx.lineTo(cx+roadBottomWidth/2,canvas.height);ctx.stroke();
 let gridOffset=(distance%50)/50;for(let i=0;i<14;i++){let p=(i+gridOffset)/14;p=Math.pow(p,2);let y=horizon+p*(canvas.height-horizon);let w=roadTopWidth+p*(roadBottomWidth-roadTopWidth);ctx.strokeStyle=`rgba(0,240,255,${p*0.6})`;ctx.beginPath();ctx.moveTo(cx-w/2,y);ctx.lineTo(cx+w/2,y);ctx.stroke();}
 if(isBridge){let p=1-bridgeY/1000;p=Math.pow(p,2.2);let y=horizon+p*(canvas.height-horizon);let w=roadTopWidth+p*(roadBottomWidth-roadTopWidth);ctx.fillStyle='#333';ctx.fillRect(cx-w/2-10,y,w+20,14);ctx.fillStyle='#00f0ff';ctx.fillRect(cx-w/2-10,y-4,w+20,4);ctx.fillRect(cx-w/2-10,y+12,w+20,4);}
 trees.forEach(t=>{let p=t.y/900;p=Math.pow(p,2);if(p<0||p>1)return;let y=horizon+p*(canvas.height-horizon);let roadW=roadTopWidth+p*(roadBottomWidth-roadTopWidth);let roadEdge=cx+(t.d==-1?-1:1)*(roadW/2+20);let x=t.d==-1?Math.min(t.x*canvas.width,roadEdge-30):Math.max(t.x*canvas.width,roadEdge+30);let s=t.s*(8+p*22);if(t.t=='p'){ctx.fillStyle='#3e2723';ctx.fillRect(x-2,y-s*.6,4,s*.6);ctx.fillStyle='#0a4a0a';ctx.beginPath();ctx.moveTo(x,y-s*1.6);ctx.lineTo(x-s*.6,y-s*.5);ctx.lineTo(x+s*.6,y-s*.5);ctx.closePath();ctx.fill();}else{ctx.fillStyle='#3e2723';ctx.fillRect(x-2,y-s*.5,4,s*.5);ctx.fillStyle='#0a4a0a';ctx.beginPath();ctx.arc(x,y-s*.7,s*.45,0,Math.PI*2);ctx.fill();}});
 obstacles.forEach(o=>{let p=1-(o.z/1000);if(p>0&&p<1){let pp=Math.pow(p,2.5);let y=horizon+pp*(canvas.height-horizon);let roadW=roadTopWidth+pp*(roadBottomWidth-roadTopWidth);let x=cx+o.x*(roadW/2);let size=10+pp*60;ctx.fillStyle=o.color;ctx.shadowColor=o.color;ctx.shadowBlur=15;if(o.type=='box')ctx.fillRect(x-size/2,y-size,size,size);else{ctx.beginPath();ctx.moveTo(x,y-size);ctx.lineTo(x-size/2,y);ctx.lineTo(x+size/2,y);ctx.closePath();ctx.fill();}ctx.shadowBlur=0;}});
 coinsArr.forEach(c=>{let p=1-(c.z/1000);if(p>0&&p<1){let pp=Math.pow(p,2.5);let y=horizon+pp*(canvas.height-horizon);let roadW=roadTopWidth+pp*(roadBottomWidth-roadTopWidth);let x=cx+c.x*(roadW/2);let size=8+pp*22;ctx.fillStyle='#ff8f00';ctx.beginPath();ctx.arc(x,y-size/2,size/2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(x,y-size/2,size/2*0.7,0,Math.PI*2);ctx.fill();}});
 smokes.forEach(s=>{let p=1-(s.z/1000);if(p>0&&p<1){let pp=Math.pow(p,2.5);let y=horizon+pp*(canvas.height-horizon);let roadW=roadTopWidth+pp*(roadBottomWidth-roadTopWidth);let x=cx+s.x*(roadW/2);ctx.fillStyle=`rgba(200,200,200,${s.l/18*0.5})`;ctx.beginPath();ctx.arc(x,y,s.s*roadW,0,Math.PI*2);ctx.fill();}});
 if(gameState==='PLAYING'){
  let px=cx+player.x*(roadBottomWidth/2.3),py=canvas.height-100;
  if(shield>0){ctx.strokeStyle='#00e5ff';ctx.lineWidth=3;ctx.globalAlpha=0.6+Math.sin(Date.now()*0.02)*0.4;ctx.beginPath();ctx.ellipse(px,py+15,42,30,0,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;}
  ctx.shadowColor='#00f0ff';ctx.shadowBlur=20;ctx.fillStyle='#00f0ff';ctx.fillRect(px-30,py,60,40);ctx.fillStyle='#ff007f';ctx.fillRect(px-18,py-15,36,20);ctx.fillStyle='#ffab00';ctx.fillRect(px-28,py+2,56,4);ctx.fillStyle='#111';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.fillText('SULTAN 53',px,py+14);ctx.fillStyle='#ff0055';ctx.fillRect(px-25,py+35,12,6);ctx.fillRect(px+13,py+35,12,6);ctx.shadowBlur=0;
  if(isDrifting){ctx.fillStyle='rgba(255,200,0,0.8)';ctx.beginPath();ctx.moveTo(px-18,py+40);ctx.lineTo(px-10,py+70+Math.random()*10);ctx.lineTo(px-4,py+40);ctx.fill();ctx.beginPath();ctx.moveTo(px+18,py+40);ctx.lineTo(px+10,py+70+Math.random()*10);ctx.lineTo(px+4,py+40);ctx.fill();}
 }
}
function startGame(){init();gameState='PLAYING';document.getElementById('start-screen').classList.add('hidden');document.getElementById('gameover-screen').classList.add('hidden');}
function gameOver(win){gameState='GAMEOVER';clearInterval(stageTimer);document.getElementById('final-score').innerText=score;document.getElementById('final-coins').innerText=coins;document.getElementById('final-drift').innerText=driftScore;document.getElementById('gameover-screen').classList.remove('hidden');}
document.getElementById('start-btn').addEventListener('click',startGame);
document.getElementById('restart-btn').addEventListener('click',startGame);
requestAnimationFrame(loop);
</script></body></html>
